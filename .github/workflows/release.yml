name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Make .dmg files (Mac)
        if: runner.os == 'macOS'
        run: |
          for pair in "mac-arm64:arm64" "mac:x64"; do
            dir="${pair%%:*}"; arch="${pair##*:}"
            stage="stage-$arch"; mkdir "$stage"
            cp -R "dist/$dir/Studyloom.app" "$stage/"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "Studyloom" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "dist/Studyloom-${{ github.ref_name == 'main' && '1.6.0' || github.ref_name }}-$arch.dmg"
            ditto -c -k --keepParent "dist/$dir/Studyloom.app" "dist/Studyloom-${{ github.ref_name == 'main' && '1.6.0' || github.ref_name }}-$arch-mac.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: studyloom-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
